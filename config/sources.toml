[[city]]
id = "zuerich"
label = "Zürich"
repo = "thodel/adressbuecher-zuerich"
commit = "3d391aada2308bcb3e9f5e0ede85369250cd4b4f"
site = ""
authority = "data/csv/10_authority_links.csv"
