# Quellen von «Vernetzte Schweiz 1860–1914».
#
# Jede Quelle ist an einen Commit gebunden. Wer einen neuen Stand übernehmen will,
# setzt `commit` neu und lässt `make ingest` laufen; der Diff in data/norm/ zeigt,
# was sich geändert hat.

[window]
year_from = 1860
year_to = 1914

# --- Adressbücher -----------------------------------------------------------
# Eine Stadt = ein Repo mit dem CSV-Schema von adressbuecher-aarau (docs/schema.md).
# `files` nennt die Eintragsdateien und die Rolle, die sie im Band haben.

[[city]]
id = "aarau"
label = "Aarau"
repo = "thodel/adressbuecher-aarau"
commit = "538c444461937e124721f2da11b1b717cb1c264f"
site = "https://thodel.github.io/adressbuecher-aarau/"
authority = "data/csv/10_authority_links.csv"
files = [
  { path = "data/csv/04_entries_fraktur.csv",   kind = "einwohner" },
  { path = "data/csv/04_entries_antiqua.csv",   kind = "einwohner" },
  { path = "data/csv/04_berufe_fraktur.csv",    kind = "berufe" },
  { path = "data/csv/04_berufe_antiqua.csv",    kind = "berufe" },
  { path = "data/csv/05_residents_fraktur.csv", kind = "bewohner" },
  { path = "data/csv/05_residents_antiqua.csv", kind = "bewohner" },
]

[[city]]
id = "basel"
label = "Basel"
repo = "thodel/adressbuecher-basel"
commit = "b94acb60704e17c5b7df22381c9d15ea6a116760"
site = "https://thodel.github.io/adressbuecher-basel/"
authority = "data/csv/10_authority_links.csv"
volumes = "data/csv/00_volumes.csv"
# Amtsträger der Behördenverzeichnisse: ein Kandidat je Person, Einträge als <cand_id>-<Band>
officeholders = "data/csv/30_authority_candidates.csv"
# Digitalisate der Bände (Staatsarchiv Basel-Stadt, Digitaler Lesesaal)
volume_urls = { "1862" = "https://dls.staatsarchiv.bs.ch/records/1225927" }
files = [
  { path = "data/csv/04_entries.csv",   kind = "einwohner" },
  { path = "data/csv/04_berufe.csv",    kind = "berufe" },
  { path = "data/csv/05_residents.csv", kind = "bewohner" },
]

[[city]]
id = "baden"
label = "Baden"
repo = "thodel/adressbuecher-baden"
commit = "bb4a7e943834653de304f9c270abcd19d2cd0fa2"
site = "https://thodel.github.io/adressbuecher-baden/"
authority = "data/csv/10_authority_links.csv"
# Gelesen mit qwen3.8 (ohne Nachkorrektur, Stichprobe 93–96 % voll korrekt). Der Band 1910 umfasst
# den ganzen Bezirk: jeder Eintrag trägt seine Gemeinde in `municipality`.
files = [
  { path = "data/csv/04_entries.csv", kind = "einwohner" },
  { path = "data/csv/04_berufe.csv",  kind = "berufe" },
]

[[city]]
id = "bern"
label = "Bern"
repo = "thodel/adressbuecher-bern"
commit = "9bb1972f23f9eb458011b96e15ded8988c9ecced"
site = "https://thodel.github.io/adressbuecher-bern/"
authority = "data/csv/10_authority_links.csv"
# Gelesen mit qwen3.8 (ohne Nachkorrektur, Stichprobe 83–84 % voll korrekt).
files = [
  { path = "data/csv/04_entries.csv", kind = "einwohner" },
  { path = "data/csv/04_berufe.csv",  kind = "berufe" },
