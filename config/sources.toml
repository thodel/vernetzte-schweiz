[[city]]
id = "lausanne"
label = "Lausanne"
repo = "thodel/adressbuecher-lausanne"
commit = "e4981566d02e2c4c3899910f00f9889861312fba"
site = "https://thodel.github.io/adressbuecher-lausanne/"
