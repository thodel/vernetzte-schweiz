# Quellen von «Vernetzte Schweiz 1860–1914».
#
# Jede Quelle ist an einen Commit gebunden. Wer einen neuen Stand übernehmen will,
# setzt `commit` neu und lässt `make ingest` laufen; der Diff in data/norm/ zeigt,
# was sich geändert hat.

[window]
year_from = 1860
year_to = 1914

# --- Adressbücher -----------------------------------------------------------
# Eine Stadt = ein Repo mit dem CSV-Schema von adressbuecher-aarau (docs/schema.md).
# `files` nennt die Eintragsdateien und die Rolle, die sie im Band haben.

[[city]]
id = "aarau"
label = "Aarau"
repo = "thodel/adressbuecher-aarau"
commit = "151689fda2d45e86d03497e45d6bbf967e52a4f5"
site = "https://thodel.github.io/adressbuecher-aarau/"
authority = "data/csv/10_authority_links.csv"
# Verzeichnis der neuen Hausnumerierung 1900 (neue Nr. → alte Nr.): Telefonbücher ab 1900 nummerieren neu,
# die Adressbücher bis 1899 alt; Gebäude über die Grenze nur über diese Konkordanz (scripts/link_ptt_ab.py)
renumbering = { path = "data/csv/05_hausnumerierung_1900.csv", year = 1900 }
files = [
  { path = "data/csv/04_entries_fraktur.csv",   kind = "einwohner" },
  { path = "data/csv/04_entries_antiqua.csv",   kind = "einwohner" },
  { path = "data/csv/04_berufe_fraktur.csv",    kind = "berufe" },
  { path = "data/csv/04_berufe_antiqua.csv",    kind = "berufe" },
  { path = "data/csv/05_residents_fraktur.csv", kind = "bewohner" },
  { path = "data/csv/05_residents_antiqua.csv", kind = "bewohner" },
  # Häuser- und Einwohnerverzeichnisse 1833–1881 (Fraktur, gemini-3.5-flash, ohne Nachkorrektur); im Zeitfenster 1867–1881
  { path = "data/csv/05_residents_frueh.csv",   kind = "bewohner" },
  # 1901 (Jg. 10) und 1913 aus der Deutschen Nationalbibliothek: 1901 qwen3.8-27b, 1913 Einwohner gemini-3.5-flash,
  # sonst qwen (Lauf aarau-dnb-final); Stichproben am Seitenbild 1901 34/40, 1913 26/30 (adressbuecher-aarau #9)
  { path = "data/csv/04_entries_dnb.csv",       kind = "einwohner" },
  { path = "data/csv/04_berufe_dnb.csv",        kind = "berufe" },
  { path = "data/csv/05_residents_dnb.csv",     kind = "bewohner" },
]

